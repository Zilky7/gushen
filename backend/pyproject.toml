[project]
name = "gushen-backend"
version = "0.1.0"
description = "Daily US stock strategy research API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "yfinance>=0.2.54,<1",
  "openai>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
